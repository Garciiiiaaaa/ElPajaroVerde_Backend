spring.application.name=ElPajaroVerde

#------------------------------
# Servidor
# -----------------------------
server.port=8080
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/casarural}
spring.datasource.username= ${DB_USERNAME:root}
spring.datasource.password= ${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql = true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------
# Encoding
# -----------------------------
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# -----------------------------
# Variables utiles
# -----------------------------
app.base.url=${APP_BASE_URL:http://localhost:8080}

# -----------------------------
# JWT
# -----------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# -----------------------------
# Autenticación
# -----------------------------
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:5}
